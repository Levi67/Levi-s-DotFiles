# ~/.tmux.conf

# Set prefix key to Ctrl+a (optional, default is Ctrl+b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (to click to switch tabs/windows)
set -g mouse on

# Status bar at the bottom
set -g status-position bottom

# Status bar styling
set -g status-bg colour234
set -g status-fg white
set -g status-left-length 40
set -g status-right-length 90

# Show window list (tabs) on the status line
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=green,bold]#I:#W#[default]"

# Highlight current window more clearly
set -g window-status-current-style bg=green,fg=black,bold

# Enable 256 colors
set -g default-terminal "screen-256color"

# Keybindings for new window/tab and switching
bind c new-window  # Ctrl+a c creates new tab
bind n next-window # Ctrl+a n next tab
bind p previous-window # Ctrl+a p prev tab

# Pane splitting (optional)
bind | split-window -h
bind - split-window -v

# Reload config easily
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
