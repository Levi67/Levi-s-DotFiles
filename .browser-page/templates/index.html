<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Start Page</title>
    <link rel="stylesheet" href="../static/style/main.css" />
    <link rel="stylesheet" href="../static/style/colors.css" />
</head>
<body>
    <!-- Clock Section -->
    <div class="clock-section">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date">Loading...</div>
    </div>

    <!-- Main Content Grid -->
    <div class="main-grid">
        <!-- Weather Section -->
        <div class="section">
            <h2>Weather</h2>
            <div class="weather" id="weather">
                <div class="weather-icon">🌤️</div>
                <div class="weather-info">Loading weather...</div>
            </div>
        </div>

        <!-- Google Search Section -->
        <div class="section">
            <h2>Google Search</h2>
            <div class="search-section">
                <form class="search-form" action="https://www.google.com/search" method="GET" target="_blank">
                    <input type="text" name="q" placeholder="Search Google or enter URL" autocomplete="off" />
                </form>
                <div class="pins" id="pins">
                    Loading pins...
                </div>
            </div>
        </div>

        <!-- Tasks Section -->
        <div class="section">
            <h2>Tasks</h2>
            
            <!-- Add Task Button -->
            <button class="add-task-btn" id="addTaskBtn">+ Add Task</button>
            
            <!-- Add Task Form (Hidden by default) -->
            <div class="task-form" id="taskForm" style="display: none;">
                <input type="text" id="taskName" placeholder="Task name" required>
                <textarea id="taskDescription" placeholder="Description (optional)" rows="2"></textarea>
                <div class="datetime-inputs">
                    <input type="date" id="taskDate">
                    <input type="time" id="taskTime">
                </div>
                <div class="form-buttons">
                    <button class="save-btn" id="saveTaskBtn">Save</button>
                    <button class="cancel-btn" id="cancelTaskBtn">Cancel</button>
                </div>
            </div>
            
            <!-- Tasks List -->
            <ul class="tasks" id="tasks">
                <li class="task">Loading tasks...</li>
            </ul>
        </div>
    </div>

    <script src="../static/js/main.js"></script>
</body>
</html>
